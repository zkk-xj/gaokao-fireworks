name: Enable GitHub Pages
on:
  push:
    branches: [gh-pages]
permissions:
  contents: read
  pages: write
  administration: write
jobs:
  enable-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Create Pages site (branch mode)
        run: |
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/pages \
            -d '{"source":{"branch":"gh-pages","path":"/"}}')
          echo "HTTP Status: $RESPONSE"
          # 201=created, 204=already exists, 409=already configured differently
          if [ "$RESPONSE" = "201" ] || [ "$RESPONSE" = "204" ] || [ "$RESPONSE" = "409" ]; then
            echo "Pages site is set up (or was already)"
          else
            echo "Unexpected response: $RESPONSE"
          fi
      - name: Verify Pages status
        run: |
          curl -s \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages
