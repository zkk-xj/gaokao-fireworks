<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>🎆 高考出分 · 接好运</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#0a0a0a; overflow:hidden;
  font-family:"STSong","SimSun","Noto Serif SC","Songti SC","KaiTi","Microsoft YaHei",serif;
  user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent;
  width:100vw; height:100vh; height:100dvh;
}
body::before{
  content:''; position:fixed; inset:0; z-index:0;
  background:radial-gradient(ellipse at 50% 0%, #1a0a0a 0%, #0a0a0a 50%, #050510 100%);
}
canvas{display:block;position:fixed;top:0;left:0;z-index:1;touch-action:none}
#bg-canvas{z-index:1} #lantern-canvas{z-index:2} #firework-canvas{z-index:3} #particle-canvas{z-index:4} #trail-canvas{z-index:3}

#overlay{
  position:fixed;inset:0;z-index:100;display:flex;
  flex-direction:column;justify-content:center;align-items:center;
  background:rgba(0,0,0,0.78);cursor:pointer;
}
#overlay.hidden{display:none;pointer-events:none}

.lantern-icon{width:90px;height:110px;margin-bottom:16px;animation:swing 2s ease-in-out infinite;transform-origin:top center}
@keyframes swing{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
.tap-text{color:#c9a96e;font-size:22px;letter-spacing:6px;text-shadow:0 0 20px rgba(201,169,110,0.5);margin-bottom:8px}
.tap-sub{color:#8b7355;font-size:13px;letter-spacing:3px;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0.5}50%{opacity:1}}

#text-layer{position:fixed;top:0;left:0;z-index:50;pointer-events:none;width:100%;max-height:70vh;overflow-y:auto;padding:35px 28px 80px;-webkit-overflow-scrolling:touch}
#blessing-text{color:#f5e6cc;font-size:clamp(14px,3vw,18px);line-height:2;text-shadow:1px 1px 2px rgba(0,0,0,0.85),0 0 8px rgba(201,169,110,0.2);white-space:pre-wrap;word-break:break-word;pointer-events:auto}

#countdown-bar{position:fixed;bottom:75px;left:50%;transform:translateX(-50%);z-index:60;display:flex;align-items:center;gap:10px;background:rgba(0,0,0,0.5);border:1px solid rgba(201,169,110,0.3);border-radius:40px;padding:8px 22px;opacity:0;transition:opacity 2s}
#countdown-bar.show{opacity:1}
.cd-item{text-align:center;min-width:38px}
.cd-num{font-size:24px;color:#f5e6cc;font-weight:bold;line-height:1.2}
.cd-label{font-size:10px;color:#8b7355;letter-spacing:2px}
.cd-sep{color:#c9a96e;font-size:18px;margin-top:-8px}

#stamp{position:fixed;bottom:130px;right:25px;z-index:55;width:90px;height:90px;opacity:0;transform:scale(0) rotate(-15deg);transition:all 1s cubic-bezier(0.175,0.885,0.32,1.275);pointer-events:none}
#stamp.show{opacity:0.85;transform:scale(1) rotate(-15deg)}
#stamp svg{width:100%;height:100%}

#music-btn{
  position:fixed;top:16px;right:16px;z-index:300;
  width:50px;height:50px;border-radius:50%;
  border:2px solid rgba(201,169,110,0.6);
  background:rgba(0,0,0,0.55);color:#c9a96e;
  font-size:22px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
  user-select:none;-webkit-user-select:none;
  transition:all 0.2s;
}
#music-btn:active{border-color:#f5e6cc;box-shadow:0 0 18px rgba(201,169,110,0.45);transform:scale(0.92)}
@media(max-width:600px){#text-layer{padding:28px 16px 14px}#stamp{bottom:120px;right:15px;width:75px;height:75px}#music-btn{top:12px;right:12px;width:52px;height:52px}}
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>
<canvas id="lantern-canvas"></canvas>
<canvas id="trail-canvas"></canvas>
<canvas id="firework-canvas"></canvas>
<canvas id="particle-canvas"></canvas>

<div id="text-layer"><div id="blessing-text"></div></div>

<div id="countdown-bar">
  <div class="cd-item"><div class="cd-num" id="cd-d">--</div><div class="cd-label">天</div></div><div class="cd-sep">:</div>
  <div class="cd-item"><div class="cd-num" id="cd-h">--</div><div class="cd-label">时</div></div><div class="cd-sep">:</div>
  <div class="cd-item"><div class="cd-num" id="cd-m">--</div><div class="cd-label">分</div></div><div class="cd-sep">:</div>
  <div class="cd-item"><div class="cd-num" id="cd-s">--</div><div class="cd-label">秒</div></div>
</div>

<div id="stamp">
  <svg viewBox="0 0 100 100">
    <rect x="5" y="5" width="90" height="90" rx="3" fill="none" stroke="#c41e1e" stroke-width="3"/>
    <rect x="12" y="12" width="76" height="76" rx="1" fill="none" stroke="#c41e1e" stroke-width="1.5"/>
    <text x="50" y="42" text-anchor="middle" fill="#c41e1e" font-size="15" font-weight="bold" font-family="KaiTi,STKaiti,serif">金榜</text>
    <text x="50" y="68" text-anchor="middle" fill="#c41e1e" font-size="15" font-weight="bold" font-family="KaiTi,STKaiti,serif">题名</text>
    <line x1="22" y1="48" x2="78" y2="48" stroke="#c41e1e" stroke-width="0.8"/>
  </svg>
</div>

<div id="overlay">
  <svg class="lantern-icon" viewBox="0 0 60 80">
    <ellipse cx="30" cy="30" rx="22" ry="26" fill="#c41e1e" stroke="#8b0000" stroke-width="1.5"/>
    <ellipse cx="30" cy="30" rx="10" ry="16" fill="#e83020" opacity="0.4"/>
    <rect x="24" y="4" width="12" height="8" rx="2" fill="#c9a96e"/><rect x="26" y="0" width="8" height="6" rx="1" fill="#c9a96e"/>
    <line x1="30" y1="56" x2="30" y2="68" stroke="#c9a96e" stroke-width="1"/><rect x="20" y="66" width="20" height="2" rx="1" fill="#c9a96e"/>
    <text x="30" y="40" text-anchor="middle" fill="#f5e6cc" font-size="9" font-family="KaiTi,serif">祈</text>
  </svg>
  <div class="tap-text">🔴 点 击 启 福</div>
  <div class="tap-sub">心诚则灵 · 高分到手</div>
</div>

<button id="music-btn" title="音乐">🔇</button>

<script>
// ==================== DOM ====================
const overlay=document.getElementById('overlay');
const blessingEl=document.getElementById('blessing-text');
const countdownBar=document.getElementById('countdown-bar');
const stamp=document.getElementById('stamp');
const musicBtn=document.getElementById('music-btn');
const bgCtx=document.getElementById('bg-canvas').getContext('2d');
const lanternCtx=document.getElementById('lantern-canvas').getContext('2d');
const trailCtx=document.getElementById('trail-canvas').getContext('2d');
const fwCtx=document.getElementById('firework-canvas').getContext('2d');
const pCtx=document.getElementById('particle-canvas').getContext('2d');

// ==================== 视口 ====================
let W,H;
function resize(){
  W=window.innerWidth;H=window.innerHeight;
  document.querySelectorAll('canvas').forEach(c=>{c.width=W;c.height=H});
}
resize();window.addEventListener('resize',resize);

// ==================== 出分祝福文案 ====================
const blessingText=
`🏮　马 上 就 要 查 分 了 ， 手 在 发 抖 吗 ？

　　十二年寒窗，等的就是这一刻。
　　不管你现在多紧张，
　　先把心放回肚子里——


✨　查 到 的 分 数 ， 一 定 比 你 想 的 更 高 ！

　　比预估多二十分，
　　比模拟考高一大截，
　　每一科都比平时考得更好——
　　语文多考 5 分，数学多考 10 分，
　　英语多考几分，综合超常发挥……


📖　愿语文选择全对，作文稳稳切题。
📐　愿数学每道大题都踩中步骤分。
🌍　愿英语阅读一气呵成，写作行云流水。
⚛️　愿理综题题顺手，道道有思路。
📜　愿文综知识储备全面爆发，答得满满当当。


🎉　成 绩 出 来 的 那 一 刻——

　　你大喊一声"我考上了！！"
　　爸妈眼眶红了，全家都为你欢呼。
　　你截图、发朋友圈、告诉所有在乎的人——
　　所有的付出，在这一刻开花结果。


🏫　最 后——

　　愿你被心仪的大学录取，
　　读到想读的专业，去到想去的城市。
　　开启人生最精彩的四年，
　　去认识新朋友，去看更大的世界。


✨　接 好 运 ！ 查 到 理 想 分 数 ！

　　愿你查到成绩的那一刻，
　　喜极而泣，得偿所愿。
　　一定会是个好结果。
　　一定。`;

// ==================== 打字机 ====================
let typingTimer=null;
function typeText(text,el,speed=22){
  let i=0;el.textContent='';
  if(typingTimer)clearInterval(typingTimer);
  typingTimer=setInterval(()=>{
    if(i<text.length){el.textContent+=text[i];i++;el.parentElement.scrollTop=el.parentElement.scrollHeight}
    else{clearInterval(typingTimer);typingTimer=null}
  },speed);
}

// ==================== 背景 ====================
class Star{
  constructor(){this.reset()}
  reset(){this.x=Math.random()*W;this.y=Math.random()*H;this.r=Math.random()*1.4+0.2;this.base=Math.random()*0.5+0.15;this.spd=Math.random()*0.018+0.004;this.ph=Math.random()*Math.PI*2}
  update(){this.opacity=this.base+Math.sin(Date.now()*this.spd+this.ph)*0.25+0.25}
  draw(ctx){
    ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,Math.PI*2);
    ctx.fillStyle=`rgba(201,169,110,${this.opacity})`;ctx.fill();
    if(this.r>1){ctx.beginPath();ctx.arc(this.x,this.y,this.r*2.5,0,Math.PI*2);ctx.fillStyle=`rgba(201,169,110,${this.opacity*0.12})`;ctx.fill()}
  }
}
const stars=Array.from({length:130},()=>new Star());

class Ink{
  constructor(){this.reset();this.y=Math.random()*H}
  reset(){this.x=Math.random()*W;this.y=-20;this.r=Math.random()*2+0.4;this.spd=Math.random()*0.3+0.1;this.wb=Math.random()*2-1;this.op=Math.random()*0.25+0.08;this.life=1}
  update(){this.y+=this.spd;this.x+=Math.sin(this.y*0.02)*this.wb;this.life-=0.0008;if(this.y>H+20||this.life<=0)this.reset()}
  draw(ctx){ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,Math.PI*2);ctx.fillStyle=`rgba(170,140,100,${this.op*this.life})`;ctx.fill()}
}
const inks=Array.from({length:55},()=>new Ink());

function drawBg(){
  bgCtx.clearRect(0,0,W,H);
  const g=bgCtx.createRadialGradient(W/2,H*0.3,0,W/2,H/2,Math.max(W,H));
  g.addColorStop(0,'rgba(20,10,8,1)');g.addColorStop(0.5,'rgba(8,5,5,1)');g.addColorStop(1,'rgba(5,3,8,1)');
  bgCtx.fillStyle=g;bgCtx.fillRect(0,0,W,H);
  stars.forEach(s=>{s.update();s.draw(bgCtx)});
  inks.forEach(p=>{p.update();p.draw(bgCtx)});
}

// ==================== 火箭 ====================
class Rocket{
  constructor(x,y,tY){
    this.x=x;this.y=y;this.targetY=tY||Math.random()*H*0.35+H*0.08;
    this.vy=-(Math.random()*5+8);this.trail=[];this.alive=true;
  }
  update(){
    this.y+=this.vy;this.vy*=0.985;
    this.trail.push({x:this.x+Math.random()*2-1,y:this.y,life:12});
    if(this.y<=this.targetY||this.trail.length>180)this.alive=false;
    for(let t of this.trail)t.life--;
    this.trail=this.trail.filter(t=>t.life>0);
  }
  draw(ctx){
    for(let t of this.trail){const a=t.life/12;ctx.beginPath();ctx.arc(t.x,t.y,1.5*a,0,Math.PI*2);ctx.fillStyle=`rgba(255,200,100,${a*0.7})`;ctx.fill()}
    ctx.beginPath();ctx.arc(this.x,this.y,3,0,Math.PI*2);ctx.fillStyle='rgba(255,220,150,0.9)';ctx.fill();
    ctx.beginPath();ctx.arc(this.x,this.y,7,0,Math.PI*2);ctx.fillStyle='rgba(255,180,60,0.3)';ctx.fill();
  }
}

// ==================== 烟花粒子 ====================
class FwP{
  constructor(x,y,color,vx,vy,life,size,trail=false){
    this.x=x;this.y=y;this.color=color;this.vx=vx;this.vy=vy;
    this.life=life;this.maxLife=life;this.size=size;
    this.gravity=0.03+Math.random()*0.04;this.drag=0.975+Math.random()*0.02;
    this.px=x;this.py=y;this.hasTrail=trail||Math.random()>0.6;
  }
  update(){this.px=this.x;this.py=this.y;this.vx*=this.drag;this.vy*=this.drag;this.vy+=this.gravity;this.x+=this.vx;this.y+=this.vy;this.life--}
  draw(ctx){
    const a=this.life/this.maxLife;const s=this.size*(0.3+a*0.7);
    if(this.hasTrail&&a>0.3){ctx.beginPath();ctx.moveTo(this.px,this.py);ctx.lineTo(this.x,this.y);ctx.strokeStyle=`rgba(255,200,120,${a*0.35})`;ctx.lineWidth=s*0.8;ctx.stroke()}
    ctx.beginPath();ctx.arc(this.x,this.y,s,0,Math.PI*2);ctx.fillStyle=this.color.replace('1)',`${a})`).replace('rgb','rgba');ctx.fill();
    if(a>0.4){ctx.beginPath();ctx.arc(this.x,this.y,s*2.5,0,Math.PI*2);ctx.fillStyle=this.color.replace('1)',`${a*0.18})`).replace('rgb','rgba');ctx.fill()}
  }
}

class Smoke{
  constructor(x,y){this.x=x;this.y=y;this.vx=(Math.random()-0.5)*0.6;this.vy=Math.random()*-0.5-0.3;this.r=Math.random()*4+3;this.life=1;this.decay=Math.random()*0.012+0.006}
  update(){this.x+=this.vx;this.y+=this.vy;this.r+=0.08;this.life-=this.decay}
  draw(ctx){if(this.life<=0)return;ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,Math.PI*2);ctx.fillStyle=`rgba(80,70,60,${this.life*0.18})`;ctx.fill()}
}

class Firework{
  constructor(x,y){
    this.x=x;this.y=y;this.particles=[];this.smokes=[];this.alive=true;this.explode();
  }
  explode(){
    const count=Math.floor(Math.random()*80)+100;
    const palettes=[
      ['rgb(255,60,50)','rgb(255,140,40)','rgb(255,200,60)','rgb(255,100,70)','rgb(255,220,90)'],
      ['rgb(255,50,80)','rgb(255,120,150)','rgb(255,80,120)','rgb(255,180,180)','rgb(255,200,150)'],
      ['rgb(255,180,40)','rgb(255,220,80)','rgb(255,200,50)','rgb(255,240,120)','rgb(255,160,30)'],
      ['rgb(100,200,255)','rgb(50,150,255)','rgb(80,180,255)','rgb(150,220,255)','rgb(200,240,255)'],
      ['rgb(200,80,255)','rgb(150,50,255)','rgb(220,120,255)','rgb(180,200,255)','rgb(255,150,255)'],
      ['rgb(255,80,60)','rgb(255,220,80)','rgb(255,150,50)','rgb(255,200,100)','rgb(50,200,100)'],
    ];
    const palette=palettes[Math.floor(Math.random()*palettes.length)];
    const type=Math.floor(Math.random()*5);
    for(let i=0;i<count;i++){
      let angle,speed,life,size,trail;
      switch(type){
        case 0:angle=Math.PI*2*i/count;speed=Math.random()*3.5+4;life=Math.floor(Math.random()*25)+65;size=Math.random()*2.2+0.8;trail=true;break;
        case 1:angle=Math.PI*2*i/count;speed=i%2===0?Math.random()*3+5.5:Math.random()*2+3;life=Math.floor(Math.random()*20)+55;size=Math.random()*1.8+0.8;trail=i%2===0;break;
        case 2:angle=Math.random()*Math.PI*2;speed=Math.random()*7+2;life=Math.floor(Math.random()*35)+85;size=Math.random()*2.8+1.5;trail=true;break;
        case 3:angle=Math.PI*2*i/count+Math.random()*0.2;speed=Math.random()*3+5;life=Math.floor(Math.random()*20)+55;size=Math.random()*1.8+1;trail=false;break;
        case 4:angle=(i<count*0.3)?(-Math.PI/2+Math.random()*0.6):(Math.random()*Math.PI*2);speed=(i<count*0.3)?Math.random()*3+6:Math.random()*4+2;life=(i<count*0.3)?Math.floor(Math.random()*20)+70:Math.floor(Math.random()*25)+60;size=Math.random()*2+1;trail=i<count*0.3;break;
      }
      const vx=Math.cos(angle)*speed,vy=Math.sin(angle)*speed;
      this.particles.push(new FwP(this.x,this.y,palette[Math.floor(Math.random()*palette.length)],vx,vy,life,size,trail));
    }
    for(let i=0;i<25;i++){const a=Math.random()*Math.PI*2,sp=Math.random()*2+0.5;this.particles.push(new FwP(this.x,this.y,'rgb(255,230,150)',Math.cos(a)*sp,Math.sin(a)*sp,Math.floor(Math.random()*25)+25,Math.random()*1.5+0.6,false))}
    if(Math.random()>0.5){const sc=Math.floor(Math.random()*12)+8;for(let i=0;i<sc;i++){const a=Math.random()*Math.PI*2,sp=Math.random()*5+3;const sx=this.x+Math.cos(a)*Math.random()*60,sy=this.y+Math.sin(a)*Math.random()*60;for(let j=0;j<12;j++){const a2=Math.PI*2*j/12,sp2=Math.random()*2+1;this.particles.push(new FwP(sx,sy,'rgb(255,200,100)',Math.cos(a2)*sp2,Math.sin(a2)*sp2,Math.floor(Math.random()*15)+25,Math.random()*1.2+0.5,false))}}}
    for(let i=0;i<30;i++)this.smokes.push(new Smoke(this.x+Math.random()*30-15,this.y+Math.random()*30-15));
  }
  update(){this.particles.forEach(p=>p.update());this.particles=this.particles.filter(p=>p.life>0);this.smokes.forEach(s=>s.update());this.smokes=this.smokes.filter(s=>s.life>0);if(this.particles.length===0&&this.smokes.length===0)this.alive=false}
  drawP(ctx){this.particles.forEach(p=>p.draw(ctx))}
  drawS(ctx){this.smokes.forEach(s=>s.draw(ctx))}
}

// ==================== 金粉 ====================
class Gold{
  constructor(x,y){this.x=x;this.y=y;this.vx=(Math.random()-0.5)*4.5;this.vy=Math.random()*-5-2.5;this.size=Math.random()*2.8+0.8;this.life=1;this.decay=Math.random()*0.018+0.008;this.rot=Math.random()*Math.PI*2;this.rSpd=(Math.random()-0.5)*0.15;this.type=Math.random()>0.6?'rect':'circle'}
  update(){this.x+=this.vx;this.vy+=0.06;this.y+=this.vy;this.life-=this.decay;this.rot+=this.rSpd}
  draw(ctx){if(this.life<=0)return;ctx.save();ctx.globalAlpha=this.life;ctx.translate(this.x,this.y);ctx.rotate(this.rot);if(this.type==='circle'){ctx.beginPath();ctx.arc(0,0,this.size,0,Math.PI*2);ctx.fillStyle='#e8c560';ctx.fill();ctx.beginPath();ctx.arc(0,0,this.size*2.2,0,Math.PI*2);ctx.fillStyle='rgba(240,210,100,0.12)';ctx.fill()}else{ctx.fillStyle='#f0d878';ctx.fillRect(-this.size*0.7,-this.size*0.25,this.size*1.4,this.size*0.5)}ctx.restore()}
}

// ==================== 孔明灯 ====================
class Lantern{
  constructor(){this.reset();this.y=Math.random()*H*0.7+H*0.3}
  reset(){this.x=Math.random()*W*0.8+W*0.1;this.y=H+70;this.spd=Math.random()*0.35+0.25;this.wSpd=(Math.random()-0.5)*0.35;this.wAmp=Math.random()*0.7+0.2;this.sc=Math.random()*0.45+0.65;this.op=Math.random()*0.45+0.3;this.ph=Math.random()*Math.PI*2;this.t='';const w=['金榜题名','前程似锦','梦想成真','旗开得胜','马到成功','心想事成','一举夺魁','鹏程万里','如愿以偿','蟾宫折桂'];if(Math.random()>0.35)this.t=w[Math.floor(Math.random()*w.length)]}
  update(dt){this.y-=this.spd*dt;this.x+=Math.sin(Date.now()*0.001*this.wSpd)*this.wAmp*dt;this.glow=0.5+Math.sin(Date.now()*0.003+this.ph)*0.3;if(this.y<-90)this.reset()}
  draw(ctx){
    ctx.save();ctx.translate(this.x,this.y);ctx.scale(this.sc,this.sc);
    ctx.beginPath();ctx.arc(0,-4,28,0,Math.PI*2);const gl=ctx.createRadialGradient(0,-4,5,0,-4,28);gl.addColorStop(0,`rgba(255,140,40,${this.op*(this.glow+0.2)})`);gl.addColorStop(0.5,`rgba(255,90,25,${this.op*0.28})`);gl.addColorStop(1,'rgba(255,50,15,0)');ctx.fillStyle=gl;ctx.fill();
    ctx.beginPath();ctx.ellipse(0,0,15.5,21,0,0,Math.PI*2);ctx.fillStyle=`rgba(215,38,28,${this.op})`;ctx.fill();ctx.strokeStyle=`rgba(170,28,18,${this.op})`;ctx.lineWidth=0.8;ctx.stroke();
    ctx.beginPath();ctx.arc(0,-8,3,0,Math.PI*2);ctx.fillStyle=`rgba(255,200,75,${this.op*this.glow})`;ctx.fill();
    ctx.beginPath();ctx.moveTo(-4,-25);ctx.lineTo(4,-25);ctx.lineTo(15,-2);ctx.moveTo(-15,-2);ctx.lineTo(-4,-25);ctx.moveTo(-15,19);ctx.lineTo(15,19);ctx.strokeStyle=`rgba(130,0,0,${this.op*0.75})`;ctx.lineWidth=1.2;ctx.stroke();
    ctx.beginPath();ctx.moveTo(-4,-25);ctx.lineTo(-4,-31);ctx.moveTo(4,-25);ctx.lineTo(4,-31);ctx.stroke();
    if(this.t){ctx.fillStyle=`rgba(255,215,170,${this.op*0.85})`;ctx.font='7.5px KaiTi,STKaiti,serif';ctx.textAlign='center';ctx.fillText(this.t,0,3.5)}
    ctx.restore();
  }
}

// ==================== 全局状态 ====================
const rockets=[],fireworks=[];
let golds=[];
const lanterns=Array.from({length:8},()=>new Lantern());
let mouseDown=false,mouseX=0,mouseY=0,fireI=null;

function launch(x,y){
  const tY=Math.random()*H*0.35+H*0.06;
  const r=new Rocket(x||Math.random()*W,H,tY);rockets.push(r);
  const chk=setInterval(()=>{if(!r.alive){clearInterval(chk);fireworks.push(new Firework(r.x,r.y));spawnGold(r.x,r.y)}},16);
}
function spawnGold(x,y,c=35){for(let i=0;i<c;i++)golds.push(new Gold(x,y))}

function drawRockets(ctx){
  ctx.clearRect(0,0,W,H);rockets.forEach(r=>r.update());rockets.forEach(r=>r.draw(ctx));
  for(let i=rockets.length-1;i>=0;i--)if(!rockets[i].alive)rockets.splice(i,1);
}
function drawFW(){
  fwCtx.clearRect(0,0,W,H);fireworks.forEach(f=>f.drawS(fwCtx));fireworks.forEach(f=>{f.update();f.drawP(fwCtx)});
  for(let i=fireworks.length-1;i>=0;i--)if(!fireworks[i].alive)fireworks.splice(i,1);
}
function drawGolds(){pCtx.clearRect(0,0,W,H);golds.forEach(g=>{g.update();g.draw(pCtx)});golds=golds.filter(g=>g.life>0)}
function drawLanterns(dt){lanternCtx.clearRect(0,0,W,H);lanterns.forEach(l=>{l.update(dt);l.draw(lanternCtx)})}

// ==================== 倒计时 ====================
const examDate=new Date('2026-06-24T00:00:00');
function updateCD(){
  const diff=examDate-new Date();
  if(diff<=0){['d','h','m','s'].forEach(id=>document.getElementById('cd-'+id).textContent='0');return}
  document.getElementById('cd-d').textContent=Math.floor(diff/86400000);
  document.getElementById('cd-h').textContent=String(Math.floor(diff/3600000)%24).padStart(2,'0');
  document.getElementById('cd-m').textContent=String(Math.floor(diff/60000)%60).padStart(2,'0');
  document.getElementById('cd-s').textContent=String(Math.floor(diff/1000)%60).padStart(2,'0');
}

// ==================== 音乐：风铃轻音 ====================
let audioCtx=null,musicPlaying=false,musicTimeout=null;

function initAudio(){
  if(!audioCtx){audioCtx=new(window.AudioContext||window.webkitAudioContext)()}
  if(audioCtx.state==='suspended')audioCtx.resume();
}

function simpleTone(freq,time,dur,vol=0.05){
  if(!audioCtx||!musicPlaying)return;
  const now=audioCtx.currentTime+time;
  const o=audioCtx.createOscillator();o.type='sine';o.frequency.value=freq;
  const g=audioCtx.createGain();
  g.gain.setValueAtTime(vol,now);
  g.gain.exponentialRampToValueAtTime(0.0001,now+dur);
  o.connect(g);g.connect(audioCtx.destination);
  o.start(now);o.stop(now+dur);
}

function playMusic(){
  initAudio();if(musicPlaying)return;
  musicPlaying=true;musicBtn.textContent='🔊';

  const s=[523,588,660,784,880,1047,1176,1319];
  const melody=[
    {n:1,d:0.6},{n:3,d:0.5},{n:5,d:0.7},{n:3,d:0.4},
    {n:2,d:0.5},{n:4,d:0.5},{n:6,d:0.7},{n:4,d:0.4},
    {n:3,d:0.5},{n:5,d:0.5},{n:7,d:0.7},{n:5,d:0.4},
    {n:6,d:0.5},{n:7,d:0.4},{n:5,d:0.4},{n:3,d:0.5},{n:1,d:0.8},
    {n:2,d:0.5},{n:3,d:0.4},{n:4,d:0.5},{n:3,d:0.4},{n:2,d:0.5},{n:1,d:1.0},
  ];

  let totalTime=0;

  function playMelody(){
    if(!musicPlaying)return;
    totalTime=0;
    for(let i=0;i<melody.length;i++){
      const m=melody[i];
      const freq=s[m.n-1];
      const dur=m.d*0.9;
      simpleTone(freq,totalTime,dur,0.045);
      totalTime+=m.d*0.6;
    }
    musicTimeout=setTimeout(playMelody,totalTime*1000+1800);
  }
  playMelody();
}

function stopMusic(){
  musicPlaying=false;musicBtn.textContent='🔇';
  if(musicTimeout){clearTimeout(musicTimeout);musicTimeout=null}
}

// ==================== 事件绑定 ====================
overlay.addEventListener('click',(e)=>{
  e.stopPropagation();overlay.classList.add('hidden');
  initAudio();playMusic();
  setTimeout(()=>typeText(blessingText,blessingEl,18),400);
  setTimeout(()=>{countdownBar.classList.add('show');updateCD()},2400);
  setTimeout(()=>stamp.classList.add('show'),5800);
  for(let i=0;i<6;i++)setTimeout(()=>launch(Math.random()*W,H*0.2+Math.random()*H*0.35),i*450+600);
});

const fwCanvas=document.getElementById('firework-canvas');
const textLayer=document.getElementById('text-layer');
let textScrolling=false,textStartY=0,textStartX=0;
let touchActive=false; // 避免 pointer + touch 双重触发

function inTextArea(cx,cy){
  const r=textLayer.getBoundingClientRect();
  return cy<r.bottom && cx>r.left && cx<r.right;
}

// 统一的烟花触发逻辑
function handleFireStart(cx,cy){
  if(!cx||!cy)return;
  // 触点在文字区域：暂不点火，等待判断是滑动还是点击
  if(inTextArea(cx,cy)){
    textStartX=cx;textStartY=cy;textScrolling=true;
    return;
  }
  textScrolling=false;
  mouseDown=true;mouseX=cx;mouseY=cy;
  launch(cx,cy);
  if(fireI)clearInterval(fireI);
  fireI=setInterval(()=>{if(mouseDown)launch(mouseX+Math.random()*50-25,mouseY+Math.random()*50-25)},180);
}

function handleFireMove(cx,cy){
  if(!cx||!cy)return;
  if(textScrolling){
    const dy=cy-textStartY,dx=cx-textStartX;
    if(Math.abs(dy)>8&&Math.abs(dy)>Math.abs(dx)){
      // 竖向滑动 → 滚动文字
      textLayer.scrollTop-=dy;
      textStartY=cy;
    }else if(Math.abs(dx)>12||Math.abs(dy)>40){
      // 横向或大幅移动 → 退出滚动，开始放烟花
      textScrolling=false;
      mouseDown=true;mouseX=cx;mouseY=cy;
      launch(cx,cy);
      if(fireI)clearInterval(fireI);
      fireI=setInterval(()=>{if(mouseDown)launch(mouseX+Math.random()*50-25,mouseY+Math.random()*50-25)},180);
    }
    return;
  }
  if(!mouseDown)return;
  mouseX=cx;mouseY=cy;
}

function handleFireEnd(cx,cy){
  if(textScrolling){
    // 轻触（没怎么滑）→ 在触点位置放一个烟花
    if(cy&&Math.abs(cy-textStartY)<8){
      const sx=textStartX||cx||mouseX;
      const sy=cy||textStartY||mouseY;
      launch(sx,sy);
      spawnGold(sx,sy,15);
    }
    textScrolling=false;
    return;
  }
  mouseDown=false;
  if(fireI){clearInterval(fireI);fireI=null}
}

// ---- Touch 事件（主力，移动端全靠它）----
fwCanvas.addEventListener('touchstart',(e)=>{
  touchActive=true;
  e.preventDefault();
  const t=e.touches[0];
  if(t)handleFireStart(t.clientX,t.clientY);
},{passive:false});

fwCanvas.addEventListener('touchmove',(e)=>{
  const t=e.touches[0];
  if(t)handleFireMove(t.clientX,t.clientY);
},{passive:false});

fwCanvas.addEventListener('touchend',(e)=>{
  const t=e.changedTouches[0];
  handleFireEnd(t?t.clientX:null,t?t.clientY:null);
  touchActive=false;
});

fwCanvas.addEventListener('touchcancel',(e)=>{
  const t=e.changedTouches[0];
  handleFireEnd(t?t.clientX:null,t?t.clientY:null);
  touchActive=false;
});

// ---- Pointer 事件（桌面鼠标兜底，touch 激活时跳过）----
fwCanvas.addEventListener('pointerdown',(e)=>{
  if(touchActive||e.pointerType==='touch')return;
  handleFireStart(e.clientX,e.clientY);
});

fwCanvas.addEventListener('pointermove',(e)=>{
  if(touchActive||e.pointerType==='touch')return;
  handleFireMove(e.clientX,e.clientY);
});

fwCanvas.addEventListener('pointerup',(e)=>{
  if(e.pointerType==='touch')return;
  handleFireEnd(e.clientX,e.clientY);
});

fwCanvas.addEventListener('pointercancel',(e)=>{
  if(e.pointerType==='touch')return;
  handleFireEnd(e.clientX,e.clientY);
});

fwCanvas.addEventListener('pointerleave',(e)=>{
  if(e.pointerType==='touch')return;
  handleFireEnd(e.clientX,e.clientY);
});

// ---- 音乐按钮 ----
musicBtn.addEventListener('pointerdown',(e)=>{
  e.stopPropagation();e.preventDefault();
  initAudio();musicPlaying?stopMusic():playMusic();
});

// ---- 空格键放烟花 ----
document.addEventListener('keydown',(e)=>{if(e.code==='Space'){e.preventDefault();launch(Math.random()*W*0.6+W*0.2,Math.random()*H*0.3+H*0.05)}});

// ==================== 动画主循环 ====================
let lastTime=performance.now(),frameCount=0;
function animate(now){
  requestAnimationFrame(animate);
  const dt=Math.min((now-lastTime)/16.67,3);lastTime=now;
  drawBg();drawLanterns(dt);drawRockets(trailCtx);drawFW();drawGolds();
  frameCount++;
  if(frameCount%130===0&&overlay.classList.contains('hidden'))launch(Math.random()*W*0.7+W*0.15,Math.random()*H*0.28+H*0.04);
  if(frameCount%350===0&&overlay.classList.contains('hidden'))lanterns.forEach(l=>{if(Math.random()>0.65)l.reset()});
}
lastTime=performance.now();requestAnimationFrame(animate);
setInterval(()=>{if(countdownBar.classList.contains('show'))updateCD()},1000);
window.addEventListener('resize',()=>{lanterns.forEach(l=>{l.x=Math.min(l.x,W)})});
</script>
